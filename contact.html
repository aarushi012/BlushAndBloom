<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>


<style>
:root{
  --bg:#fff5f8;
  --card:#ffffff;
  --pink:#d6336c;
  --text:#333;
  --shadow: rgba(0,0,0,0.1);
  --footer-bg: linear-gradient(135deg,#c2185b,#ad1457);
  --input-border: #ccc;
  --stars: #ffd700;
}




*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins;
  background:var(--bg);
  color:var(--text);
  scroll-behavior:smooth;
  transition: background 0.3s, color 0.3s;
}

/* HEADER */
header{
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:var(--bg);
  box-shadow:0 2px 10px var(--shadow);
  z-index:10;
  transition: background 0.3s, box-shadow 0.3s;
}
header h2{color:var(--pink)}
nav a{
  margin:0 12px;
  text-decoration:none;
  color:var(--text);
  font-weight:500;
  transition: color 0.3s;
}
nav a:hover{color:var(--pink)}


section{padding:80px 40px}




/* CONTACT */
.contact-box{
  max-width:450px;
  margin:auto;
  background:var(--card);
  padding:30px;
  border-radius:22px;
  box-shadow:0 10px 20px var(--shadow);
  transition: background 0.3s, box-shadow 0.3s;
}
.contact-box input,
.contact-box textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid var(--input-border);
  background: var(--card);
  color: var(--text);
  transition: border 0.3s, background 0.3s, color 0.3s;
}
.contact-box button{
  width:100%;
  padding:12px;
  background:var(--pink);
  border:none;
  color:#fff;
  border-radius:20px;
  cursor:pointer;
  transition: background 0.3s;
}
.contact-box button:hover { background: #b52a5a; }

/* FOOTER */
footer{
  background:var(--footer-bg);
  color:#fff;
  padding:25px;
  border-radius:25px 25px 0 0;
  transition: background 0.3s;
}
.footer-content{
  display:flex;
  justify-content:space-around;
  align-items:center;
  flex-wrap:wrap;
}
.social-links a{
  color:#fff;
  margin:0 10px;
  font-size:20px;
}
.newsletter input{
  padding:8px;
  border-radius:5px;
  border:none;
  background: var(--card);
  color: var(--text);
}
.newsletter button{
  padding:8px 15px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  background: var(--pink);
  color: #fff;
  transition: background 0.3s;
}
.newsletter button:hover { background: #b52a5a; }
</style>
<body>
    <header>
  <h2><i class="fas fa-heart"></i> Blush & Bloom</h2>
  <nav>
    <a href="index.html">Home</a>
    <a href="skin.html">Skincare</a>
    <a href="makeup.html">Makeup</a>
    <a href="testimonial.html">Testimonials</a>
    <a href="contact.html" style="color: #b52a5a;">Contact</a>
  
  </nav>
</header>
<section id="contact">
<h2 style="color:var(--pink); text-align:center">
  <i class="fas fa-envelope"></i> Contact Us
</h2>

<div class="contact-box">
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="5" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>
</section>

<footer>
<div class="footer-content">
  <p>© 2025 Blush & Bloom</p>
  
  <form class="newsletter">
    <input type="email" placeholder="Subscribe">
    <button>Subscribe</button>
  </form>
</div>
</footer>


</body>
</html>
