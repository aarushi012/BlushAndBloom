<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

</head>

<style>
:root{
  --bg:#fff5f8;
  --card:#ffffff;
  --pink:#d6336c;
  --text:#333;
  --shadow: rgba(0,0,0,0.1);
  --footer-bg: linear-gradient(135deg,#c2185b,#ad1457);
  --input-border: #ccc;
  --stars: #ffd700;
}
.dark-mode {
  --bg: #1a1a1a;
  --card: #2a2a2a;
  --pink: #ff6b9d;
  --text: #e0e0e0;
  --shadow: rgba(0,0,0,0.3);
  --footer-bg: linear-gradient(135deg,#8e0038,#6a0040);
  --input-border: #555;
  --stars: #ffd700;
}
#theme-toggle {
  background: none;
  border: none;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  transition: color 0.3s;
}
#theme-toggle:hover { color: var(--pink); }



*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins;
  background:var(--bg);
  color:var(--text);
  scroll-behavior:smooth;
  transition: background 0.3s, color 0.3s;
}

/* HEADER */
header{
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:var(--bg);
  box-shadow:0 2px 10px var(--shadow);
  z-index:10;
  transition: background 0.3s, box-shadow 0.3s;
}
header h2{color:var(--pink)}
nav a{
  margin:0 12px;
  text-decoration:none;
  color:var(--text);
  font-weight:500;
  transition: color 0.3s;
}


section{padding:80px 40px}

/* HERO */
.hero{text-align:center}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:44px;
  color:var(--pink);
}
.hero img{
  max-width:600px;
  width:100%;
  border-radius:15px;
  box-shadow:0 10px 20px var(--shadow);
  margin:20px 0;
}
.cta-btn{
  display:inline-block;
  padding:12px 24px;
  background:var(--pink);
  color:#fff;
  border-radius:25px;
  text-decoration:none;
  transition: background 0.3s;
}
.cta-btn:hover { background: #b52a5a; }








/* FOOTER */
footer{
  background:var(--footer-bg);
  color:#fff;
  padding:25px;
  border-radius:25px 25px 0 0;
  transition: background 0.3s;
}
.footer-content{
  display:flex;
  justify-content:space-around;
  align-items:center;
  flex-wrap:wrap;
}

.newsletter input{
  padding:8px;
  border-radius:5px;
  border:none;
  background: var(--card);
  color: var(--text);
}
.newsletter button{
  padding:8px 15px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  background: var(--pink);
  color: #fff;
  transition: background 0.3s;
}
.newsletter button:hover { background: #b52a5a; }
</style>
<body>
    <header>
  <h2> Blush & Bloom</h2>
  <nav>
    <a href="index.html" style="color: #b52a5a;">Home</a>
    <a href="skin.html">Skincare</a>
    <a href="makeup.html">Makeup</a>
    <a href="testimonial.html">Testimonials</a>
    <a href="contact.html">Contact</a>
  <button id="theme-toggle"><i class="fas fa-moon"></i></button>
  </nav>
</header>
<section id="home" class="hero">
  <h1>Glow Naturally with Blush & Bloom</h1>
  <p>Your all-in-one beauty guide for skincare & makeup.</p>
  <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=600&q=80">
  <br>
  <a href="#skincare" class="cta-btn">Get Started</a>
</section>
<footer>
<div class="footer-content">
  <p>© 2025 Blush & Bloom</p>
 
  <form class="newsletter">
    <input type="email" placeholder="Subscribe">
    <button>Subscribe</button>
  </form>
</div>
</footer>

<script>
const themeToggle = document.getElementById('theme-toggle');
const body = document.body;
const icon = themeToggle.querySelector('i');

// Check for saved theme preference or default to light mode
const currentTheme = localStorage.getItem('theme') || 'light';
if (currentTheme === 'dark') {
  body.classList.add('dark-mode');
  icon.classList.remove('fa-moon');
  icon.classList.add('fa-sun');
}

// Toggle theme on button click
themeToggle.addEventListener('click', () => {
  body.classList.toggle('dark-mode');
  const isDark = body.classList.contains('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  icon.classList.toggle('fa-moon');
  icon.classList.toggle('fa-sun');
});
</script>

</body>
</html>
